name: Publish to PyPI

# Publication via PyPI Trusted Publishing (OIDC) — pas de token à gérer.
# Configuration requise côté pypi.org (une fois) :
#   https://pypi.org/manage/account/publishing/
#   PyPI Project Name: xcdk
#   Owner: xcore-team
#   Repository name: xcoreSDK
#   Workflow filename: pypi.yaml
#   Environment name: (laisser vide)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à republier (ex: v1.2.3)"
        required: true
        type: string
      force:
        description: "Confirmer la republication de la même version"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate inputs
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier le consentement
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ inputs.force }}" != "true" ]; then
            echo "❌ Cochez 'force' pour confirmer la republication."
            exit 1
          fi
          echo "✅ Republication confirmée pour ${{ inputs.tag }}"

  build-and-publish:
    name: Build and publish
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      id-token: write # requis pour l'OIDC de Trusted Publishing

    steps:
      - name: Resolve ref
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=refs/tags/$(echo '${{ inputs.tag }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          else
            echo "ref=${{ github.ref }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
