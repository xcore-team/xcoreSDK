[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xcdk"
version = "0.1.0"
description = "SDK Python pour développer des plugins xcore : bases, mixins, décorateurs et utilitaires (actions, routes HTTP, événements, hooks, scheduling, cache, observabilité)."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "XCoreRuntime>=2.4.4",
]

[tool.hatch.build.targets.wheel]
packages = ["sdk"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
]
